<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cadastro</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <link rel="icon" type="image/png" href="../../assets/icon.png" />
</head>

<body>
  <div id="container">

    <header id="header-container">
      <img id="logo-id" src="../../assets/icon.png" alt="logo" />
      <h1 id="header-title">Novelas Mexicanas</h1>
    </header>

    <main>
      <div id="subtitle-page">
        <h2 id="welcome-text">Crie sua conta</h2>
        <p>Preencha os campos abaixo para se cadastrar.</p>
      </div>

      <form onsubmit="cadastrar(event)">

        <div class="input-container">
          <label>Nome completo:</label>
          <input id="input-name" class="input-text" type="text" placeholder="Digite seu nome" required />
          <span id="error-name" class="error-msg">Nome inválido!</span>
        </div>

        <div class="input-container">
          <label>CPF:</label>
          <input id="input-cpf" class="input-text" type="text" placeholder="000.000.000-00" required />
          <span id="error-cpf" class="error-msg">CPF inválido!</span>
        </div>

        <div class="input-container">
          <label>E-mail:</label>
          <input id="input-email" class="input-text" type="email" placeholder="Digite seu e-mail" required />
          <span id="error-email" class="error-msg">E-mail inválido!</span>
        </div>

        <div class="input-container">
          <label>Celular:</label>
          <input id="input-celular" class="input-text" type="tel" placeholder="(XX) XXXXX-XXXX" required />
          <span id="error-celular" class="error-msg">Celular inválido!</span>
        </div>

        <div class="input-row">
            <div class="input-container">
              <label>Data de nascimento:</label>
              <input
                id="input-dataNascimento"
                class="input-text"
                type="date"
                required
              />
            </div>

            <div class="input-container">
              <label>Sexo:</label>
              <select id="input-sexo" class="input-text" required>
                <option value="">Selecione</option>
                <option value="feminino">Feminino</option>
                <option value="masculino">Masculino</option>
                <option value="outro">Outro</option>
                <option value="naoInformar">Prefiro não informar</option>
              </select>
            </div>
            <span id="error-sexo" class="error-msg">Preencher!</span>
          </div>

        <div class="input-container">
          <label>Senha:</label>
          <input id="input-senha" class="input-text" type="password" placeholder="Digite sua senha" required />
          <span id="error-senha" class="error-msg">Senha inválida!</span>
        </div>

        <div class="input-container">
          <label>Confirmar senha:</label>
          <input id="input-confirmeSenha" class="input-text" type="password" placeholder="Confirme sua senha" required />
          <span id="error-confirmeSenha" class="error-msg">Senha divergente!</span>
        </div>

        <div id="checkbox-container">
          <input id="id-checkbox" type="checkbox" />
          <label>Li e aceito os termos de uso</label>
        </div>

        <button id="btn-sign" type="submit">Registrar</button>

      </form>
    </main>

    <footer id="footer-container">
      Já tem uma conta?
      <a id="link-container" href="../../pages/login/index.html">Entrar</a>
    </footer>

  </div>
</body>
<script src="script.js"></script>
</html>
