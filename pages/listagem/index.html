<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../../assets/icon.png" />
  </head>

  <body>
    <header class="header">
      <div class="brand">
        <img id="logo-id" src="../../assets/icon.png" alt="logo" />
        <h1>Novelas Mexicanas</h1>
      </div>

      <!-- BUSCA DESKTOP -->
      <div class="search">
        <input type="text" placeholder="Pesquisar novela..." />
      </div>

      <!-- AÇÕES MOBILE -->
      <div class="acoes-mobile">
        <!-- BOTÃO VOLTAR MOBILE – MESMO DO PRODUTO -->
        <a href="../../index.html" class="back-mobile">
          <img src="../../assets/voltar.png" alt="Voltar" />
        </a>
        <div onclick="mostrarMenu()" id="container-menu-mobile">
          <button class="menu-btn">
            <img id="tree-bar-icon" src="../../assets/menu.png" alt="" />
          </button>
          <div id="menu-mobile">
          <nav id="lista-menu-mobile">
            <a class="lista-btn" href="https://www.google.com.br">Sobre</a>
            <a class="lista-btn" href="../../index.html">Sair</a>
          </nav>
          </div>
        </div>
      </div>

      <!-- NAVEGAÇÃO DESKTOP -->
      <nav class="nav">
        <a class="lista-btn" href="../../index.html">Voltar</a>
        <a class="lista-btn" href="https://www.google.com.br">Sobre</a>
        <a class="lista-btn" href="../../index.html">Sair</a>
      </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container" id="container"></main>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 Novelas Mexicanas</p>
    </footer>
  </body>
  <script src="script.js"></script>
</html>
